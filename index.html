/* Carnet de bord : la charte du dossier (terre cuite seule couleur, gris chauds), lisible au soleil et la nuit. */
:root{

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

  --acc:#e08a6d; --acc-ink:#1c0f0a; --acc-soft:#3a251d;
  --ok:#8fcf95; --ok-bg:#1f3322; --warn:#f0c46a; --warn-bg:#3a2e14; --bad:#f39a90; --bad-bg:#401d1a; color-scheme:dark } }
:root[data-theme="dark"]{

  --acc:#e08a6d; --acc-ink:#1c0f0a; --acc-soft:#3a251d;
  --ok:#8fcf95; --ok-bg:#1f3322; --warn:#f0c46a; --warn-bg:#3a2e14; --bad:#f39a90; --bad-bg:#401d1a; color-scheme:dark }
*{box-sizing:border-box}

h1{font-size:22px;line-height:1.2;margin:18px 0 4px;color:var(--acc);text-wrap:balance}

.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

.dayhead .d{font-size:13px;color:var(--ink2)}.dayhead .d::first-letter{text-transform:uppercase}

.timeline li:first-child{border-top:0}

.todo li{border-top:1px solid var(--line)}

.quick button svg{width:22px;height:22px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.quick button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.prog{height:8px;border-radius:4px;background:var(--wash);overflow:hidden;margin:6px 0 2px}

.rate{display:flex;align-items:center;gap:8px;grid-column:1/-1;font-size:13px;color:var(--ink2)}
.rate input{width:90px;font:inherit;font-size:15px;padding:6px 8px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--ink)}
.ibtn .cur{font-weight:800;font-size:12.5px;color:var(--ink)}
</style>

<script>
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem("pe26:"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("pe26:"+k, JSON.stringify(v)); }catch(e){} }
};
let D = null;
const state = { tab: "jour", city: null, section: null, agg: null, info: null, dayIdx: null, recoKind: "voir" };

/* ---------- dates ---------- */
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function todayISO(){ const n = new Date(); return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function fmtDay(s){ const d = parseISO(s); return JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]; }
function daysBetween(a, b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }

/* ---------- small UI helpers ---------- */
function toast(t){ const el = document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), 1600); }
function copy(text, btn){
  const ok = () => { if(btn){ btn.classList.add("done"); btn.textContent="Copié"; setTimeout(()=>{btn.classList.remove("done"); btn.textContent="Copier";},1400);} else toast("Copié"); };
  try{
    navigator.clipboard.writeText(text).then(ok, () => fallback());
  }catch(e){ fallback(); }
  function fallback(){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); ok();}catch(e){ toast("Sélectionne le texte pour le copier"); } ta.remove(); }
}
const digits = s => String(s).replace(/[^\d+]/g,"");
function geoUrl(m, name){ return m.lat!=null ? "geo:"+m.lat+","+m.lng+"?q="+m.lat+","+m.lng+"("+encodeURIComponent(name||"")+")" : "geo:0,0?q="+encodeURIComponent(m.q); }
function mapUrl(m){ return m.lat!=null ? "https://www.google.com/maps/search/?api=1&query="+m.lat+","+m.lng : "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(m.q); }

/* ---------- card renderer ---------- */
function rowsHTML(rows){
  if(!rows || !rows.length) return "";
  return '<dl class="rows">'+rows.map(r => {
    const [k, v, f] = r;
    let extra = "";
    if(f==="c") extra = '<button class="cp" data-copy="'+esc(v)+'">Copier</button>';
    if(f==="tel"){ const n = digits(v); extra = '<span style="display:flex;gap:6px;flex:none"><button class="cp" data-copy="'+esc(v.replace(/\s*\(.*\)$/,""))+'">Copier</button>'+(n.length>8?'<a class="cp" style="text-decoration:none" href="https://wa.me/'+n.replace("+","")+'" target="_blank" rel="noopener">WhatsApp</a>':'')+'</span>'; }
    const mono = f==="tel" ? ' class="mono tel"' : (f==="c" ? ' class="mono"' : "");
    const shown = f==="tel" ? esc(v).replace(/\+?\d[\d ]+\d/, x=>x.replace(/ /g,'\u00a0')) : esc(v);
    return '<dt>'+esc(k)+'</dt><dd><span'+mono+'>'+shown+'</span>'+extra+'</dd>';
  }).join("")+'</dl>';
}
function cardHTML(it, ctx){
  const id = ctx ? ' id="'+esc(ctx)+'"' : "";
  let h = '<article class="card"'+id+'>';
  h += '<div class="hd"><div>'+(it.kind?'<div class="kind '+it.kind+'">'+(it.kind==="voir"?"À voir":"À manger")+'</div>':'')+'<h3>'+esc(it.t)+'</h3></div>'+(it.tag?'<span class="tag acc">'+esc(it.tag)+'</span>':'')+'</div>';
  h += rowsHTML(it.rows);
  if(it.notes && it.notes.length) h += '<ul class="notes">'+it.notes.map(n=>'<li>'+esc(n)+'</li>').join("")+'</ul>';
  if(it.es && it.es.length) h += '<div class="es">'+it.es.map(p=>'<div><b lang="es">'+esc(p[0])+'</b><span>'+esc(p[1])+'</span></div>').join("")+'</div>';
  const acts = [];
  if(it.map) acts.push('<a class="btn" href="'+mapUrl(it.map)+'" target="_blank" rel="noopener">'+ICON.map+'Carte</a><a class="btn" href="'+geoUrl(it.map, it.t)+'">'+ICON.map+'Hors ligne</a>');
  if(it.driver) acts.push('<button class="btn fill" data-driver="'+esc(it.driver)+'">'+ICON.car+'Montrer au chauffeur</button>');
  if(it.link==="altitude") acts.push('<button class="btn" data-go="altitude">Ouvrir le test</button>');
  else if(it.link==="cash") acts.push('<button class="btn" data-goinfo="cash">Plan d\'argent complet</button>');
  else if(it.link) acts.push('<button class="btn" data-city="'+esc(it.link)+'">Ouvrir '+esc(cityById(it.link).nom)+'</button>');
  if(acts.length) h += '<div class="acts">'+acts.join("")+'</div>';
  return h+'</article>';
}
const cityById = id => D.villes.find(c => c.id===id);
function cityForDate(iso){ const j = D.jours.find(x=>x.d===iso); return j && j.ville ? j.ville : null; }

/* ---------- views ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===state.tab ? "page" : "false"));
  const m = $("#main");
  if(state.tab==="jour") m.innerHTML = viewJour();
  else if(state.tab==="villes") m.innerHTML = viewVilles();
  else if(state.tab==="altitude") m.innerHTML = viewAlt();
  else if(state.tab==="sante") m.innerHTML = viewSante();
  else m.innerHTML = viewInfos();
  m.insertAdjacentHTML("beforeend", '<p class="foot">Source : dossier '+esc(D.version)+'. En cas de doute, le PDF fait foi.</p>');
  if(state.tab==="altitude") bindAlt();
  bindConv(); bindDep();
  const on = m.querySelector('.chips [aria-pressed="true"]'); if(on){ const bar = on.parentElement; bar.scrollLeft = on.offsetLeft - 16; }
}

function currentDayIndex(){
  const t = todayISO(); const i = D.jours.findIndex(j=>j.d===t);
  if(i>=0) return i;
  if(t < D.jours[0].d) return -1;
  return D.jours.length-1;
}
function viewJour(){
  const t = todayISO();
  const ci = currentDayIndex();
  if(state.dayIdx==null) state.dayIdx = ci<0 ? 0 : ci;
  const idx = state.dayIdx; const j = D.jours[idx];
  let h = "";
  if(ci<0 && idx===0){
    const n = daysBetween(t, D.depart);
    h += '<div class="card" style="margin-top:16px;display:flex;gap:16px;align-items:center"><div class="count">J-'+n+'</div><div><b>Départ le dimanche 18 octobre</b><p class="sub">Départ à pied à 05h15, car de 06:05 à la halte Belcier.</p></div></div>';
  }
  const nx = nextDepart();
  if(nx) h += '<div class="next"><div class="nl">Prochain départ · '+esc(nx.when)+'</div><div class="nt">'+esc(nx.t)+'</div><div class="nx">'+esc(nx.x)+'</div><div class="nc">'+esc(nx.count)+'</div></div>';
  h += '<div class="quick" role="navigation" aria-label="Accès rapide">'+
    '<button data-goinfo="urgences">'+ico("phone")+'Urgences</button>'+
    '<button data-goinfo="cash">'+ico("coin")+'Argent</button>'+
    '<button data-conv="1">'+ico("card")+'Convertir</button>'+
    '<button data-go="sante">'+ico("shield")+'Santé</button></div>';
  const isToday = j.d===t;
  h += '<div class="dayhead"><button class="ibtn nav" data-day="'+(idx-1)+'" aria-label="Jour précédent" '+(idx<=0?'disabled style="opacity:.35"':'')+'>'+ICON.prev+'</button>'+
    '<div class="mid"><div class="d">'+(isToday?"Aujourd'hui · ":"")+fmtDay(j.d)+'</div><div class="l">'+esc(j.lieu)+'</div></div>'+
    '<button class="ibtn nav" data-day="'+(idx+1)+'" aria-label="Jour suivant" '+(idx>=D.jours.length-1?'disabled style="opacity:.35"':'')+'>'+ICON.next+'</button></div>';
  const meta = [];
  const dn = daysBetween("2026-10-18", j.d);
  if(dn>=0 && dn<=21) meta.push('<span class="tag acc">Jour '+(dn+1)+' / 22</span>');
  if(j.nuit) meta.push('<span class="tag">Nuit : '+esc(j.nuit)+'</span>');
  if(j.alt!=null) meta.push('<span class="tag">'+j.alt.toLocaleString("fr-FR")+' m</span>');
  if(meta.length) h += '<div class="meta">'+meta.join("")+'</div>';
  if(j.test){
    const done = slotsDone();
    const left = j.test.filter(mo => !done[j.d+"|"+mo]);
    if(left.length) h += '<div class="alert acc" style="margin-top:10px"><b>Test d\'altitude '+(j.test.length>1?"ce matin et ce soir":"ce soir")+'</b>Lake Louise + démarche talon-pointe, au moins 6 h après l\'arrivée.<div class="acts"><button class="btn fill" data-go="altitude">Faire le test</button></div></div>';
    else h += '<div class="alert ok" style="margin-top:10px"><b>Tests du jour faits</b>Résultats dans l\'onglet Altitude.</div>';
  }
  if(j.plan && j.plan.length){
    h += '<h2>Programme</h2><div class="card"><ol class="timeline">'+j.plan.map(p=>'<li><span class="h">'+esc(p[0]||"·")+'</span><span>'+esc(p[1])+'</span></li>').join("")+'</ol></div>';
  }
  if(j.todo && j.todo.length){
    const ck = store.get("todo", {});
    h += '<h2>À faire</h2><div class="card"><ul class="todo">'+j.todo.map((x,i)=>{ const k=j.d+"#"+i; return '<li><label><input type="checkbox" id="td-'+k.replace(/[^a-z0-9]/gi,"")+'" data-todo="'+k+'" '+(ck[k]?"checked":"")+'><span>'+esc(x)+'</span></label></li>'; }).join("")+'</ul></div>';
  }
  if(j.ville){
    const c = cityById(j.ville);
    h += '<h2>'+esc(c.nom)+' en un geste<button class="h2link" data-city="'+c.id+'">fiche ›</button></h2><div class="tiles">'+c.sections.map((sx,i)=>tile('data-citysec="'+c.id+'|'+i+'"', secIco(sx), sx.t, "")).join("")+'</div>';
  }
  const pending = D.suivi;
  if(pending.length){
    h += '<h2>En suivi</h2>'+pending.map(s => '<article class="card"><div class="hd"><h3>'+esc(s.t)+'</h3><span class="tag">contrôle ~'+esc(fmtDay(s.d))+'</span></div><p class="sub" style="font-size:14px">'+esc(s.txt)+'</p>'+rowsHTML(s.rows)+'</article>').join("");
  }
  h += '<div class="acts" style="justify-content:center;margin-top:14px"><button class="btn" data-goinfo="depenses">+ Noter une dépense</button><button class="btn" data-conv="1">Convertir S/ ↔ €</button></div>';
  if(!isToday && ci>=0) h += '<div class="acts" style="justify-content:center"><button class="btn" data-day="'+ci+'">Revenir à aujourd\'hui</button></div>';
  return h;
}

function aggItems(a){

  return out;
}

/* ---------- prochain départ ---------- */
function nextDepart(){
  const now = Date.now();
  const list = (D.departs||[]).map(e => { const [d,hm] = e.dt.split("T"); const [Y,M,Dd] = d.split("-").map(Number); const [hh,mm] = hm.split(":").map(Number); return Object.assign({ ts: new Date(Y,M-1,Dd,hh,mm).getTime(), d, hm }, e); });
  const nx = list.find(e => e.ts > now - 10*60000);
  if(!nx) return null;
  const diff = Math.max(0, nx.ts - now); const mins = Math.round(diff/60000);
  const dd = Math.floor(mins/1440), hh = Math.floor((mins%1440)/60), mi = mins%60;
  const count = diff===0 ? "maintenant" : "dans "+(dd? dd+" j ":"")+(dd||hh? hh+" h ":"")+(dd? "" : mi+" min");
  return { t:nx.t, x:nx.x, when: fmtDay(nx.d)+" à "+nx.hm, count };
}

/* ---------- convertisseur ---------- */
let RATE = (function(){ const r = store.get("rate", 3.87); return (typeof r==="number" && r>2 && r<6) ? r : 3.87; })();
function convHTML(){
  return '<div class="card conv"><div class="cv"><label for="cvS">Soles</label><input id="cvS" type="number" inputmode="decimal" placeholder="100"></div><span class="eq">=</span><div class="cv"><label for="cvE">Euros</label><input id="cvE" type="number" inputmode="decimal" placeholder="'+(100/RATE).toFixed(2).replace(".",",")+'"></div><label class="rate" for="cvR">Taux : 1 € = <input id="cvR" type="number" inputmode="decimal" step="0.01" value="'+RATE+'"> S/ <span>(modifiable, retenu sur ce téléphone)</span></label></div>';
}
function bindConv(){
  const s = $("#cvS"), e = $("#cvE"); if(!s) return;
  s.addEventListener("input", () => { e.value = s.value==="" ? "" : (Number(s.value)/RATE).toFixed(2); });
  e.addEventListener("input", () => { s.value = e.value==="" ? "" : (Number(e.value)*RATE).toFixed(2); });
  const r = $("#cvR"); if(r) r.addEventListener("change", () => { const v = Number(String(r.value).replace(",", ".")); if(v>2 && v<6){ RATE = v; store.set("rate", v); if(s.value!=="") e.value = (Number(s.value)/RATE).toFixed(2); toast("Taux enregistré"); } else { r.value = RATE; toast("Taux entre 2 et 6"); } });
}

const CATS = ["Repas","Hébergement","Transport","Visites","Courses","Autre"];
let dep = { cur:"S/", mode:"esp", cat:"Repas" };
const fmtS = n => (Math.round(n*100)/100).toLocaleString("fr-FR",{maximumFractionDigits:2})+" S/";
const fmtE = n => (Math.round(n*100)/100).toLocaleString("fr-FR",{maximumFractionDigits:2})+" €";
function depList(){ return store.get("dep", []); }
function depHTML(){
  const L = depList(); const t = todayISO();
  const inS = x => x.cur==="€" ? x.amt*RATE : x.amt;
  const tot = L.reduce((a,x)=>a+inS(x),0), esp = L.filter(x=>x.mode==="esp").reduce((a,x)=>a+inS(x),0), crt = tot-esp;
  const today = L.filter(x=>x.d===t).reduce((a,x)=>a+inS(x),0);
  let h = '<div class="card depf"><div class="row1"><input id="depAmt" type="number" inputmode="decimal" placeholder="Montant" aria-label="Montant"><div class="seg2 mini">'+["S/","€"].map(c=>'<button data-dcur="'+c+'" aria-pressed="'+(dep.cur===c)+'">'+c+'</button>').join("")+'</div></div>';
  h += '<div class="seg2 mini" style="margin-top:8px">'+[["esp","Espèces"],["carte","Carte"]].map(([v,l])=>'<button data-dmode="'+v+'" aria-pressed="'+(dep.mode===v)+'">'+l+'</button>').join("")+'</div>';
  h += '<div class="catrow">'+CATS.map(c=>'<button class="chip" data-dcat="'+c+'" aria-pressed="'+(dep.cat===c)+'">'+c+'</button>').join("")+'</div>';
  h += '<input id="depNote" type="text" placeholder="Note (facultatif) : Santa Catalina, taxi…" aria-label="Note"><p id="depErr" class="sub" style="color:var(--bad);margin:6px 0 0"></p><button class="btn fill" id="depAdd" style="width:100%;justify-content:center;margin-top:8px">Ajouter</button></div>';
  h += '<div class="kpis"><div><span>Aujourd\'hui</span><b>'+fmtS(today)+'</b></div><div><span>Total</span><b>'+fmtS(tot)+'</b><small>'+fmtE(tot/RATE)+'</small></div><div><span>Espèces</span><b>'+fmtS(esp)+'</b><small>plan ~3 000 S/</small></div><div><span>Carte</span><b>'+fmtS(crt)+'</b></div></div>';
  h += '<p class="sub" style="font-size:13px">Dépenses à venir estimées par le dossier : '+esc(D.budgetSurPlace)+' (~'+fmtE(tot/RATE)+' dépensés ici).</p>';
  const byCat = CATS.map(c=>[c, L.filter(x=>x.cat===c).reduce((a,x)=>a+inS(x),0)]).filter(x=>x[1]>0);
  if(byCat.length) h += '<h2>Par catégorie</h2><div class="card">'+rowsHTML(byCat.map(([c,v])=>[c, fmtS(v)+" · "+fmtE(v/RATE)]))+'</div>';
  h += '<h2>Historique</h2>';
  if(!L.length) h += '<div class="card"><p class="sub">Aucune dépense notée. La première : la caution du bus ou le café de Madrid, par exemple.</p></div>';
  else h += '<div class="card"><ul class="hist">'+L.map((x,i)=>[x,i]).reverse().map(([x,i])=>{ const dt=new Date(x.ts); return '<li><span><b>'+dt.getDate()+' '+MOIS[dt.getMonth()]+'</b> · '+esc(x.cat)+(x.note?' · '+esc(x.note):'')+'<br><span class="sub" style="font-size:12.5px">'+(x.mode==="esp"?"Espèces":"Carte")+'</span></span><span class="mono" style="font-weight:700">'+(x.cur==="€"?fmtE(x.amt):fmtS(x.amt))+'</span><button class="cp" data-ddel="'+i+'" aria-label="Supprimer">×</button></li>'; }).join("")+'</ul></div>';
  h += '<h2>Convertir</h2>'+convHTML();
  return h;
}
function bindDep(){
  const add = $("#depAdd"); if(!add) return;
  add.addEventListener("click", () => {
    const a = Number(String($("#depAmt").value).replace(",", "."));
    if(!a || a<=0){ $("#depErr").textContent = "Entre un montant."; return; }
    const L = depList(); L.push({ ts:Date.now(), d:todayISO(), amt:a, cur:dep.cur, mode:dep.mode, cat:dep.cat, note:$("#depNote").value.trim() }); store.set("dep", L);
    toast("Dépense notée"); render();
  });
  $("#depAmt").addEventListener("input", () => { $("#depErr").textContent = ""; });
}

const LL = [
  { k:"tete", t:"Mal de tête", es:"dolor de cabeza", o:["Aucun","Léger","Modéré","Sévère"] },
  { k:"dig", t:"Troubles digestifs", es:"náuseas", o:["Bon appétit","Appétit ↓ ou nausées","Nausées / vomit. modérés","Sévères"] },
  { k:"fat", t:"Fatigue, faiblesse", es:"cansancio", o:["Aucune","Légère","Modérée","Sévère"] },
  { k:"ver", t:"Vertiges, tête légère", es:"mareo", o:["Aucun","Légers","Modérés","Sévères"] }
];
let form = { tete:null, dig:null, fat:null, ver:null, gait:null };
function slots(){ const out=[]; D.jours.forEach(j => (j.test||[]).forEach(mo => out.push({ d:j.d, mo, lieu:(cityById(j.ville)||{}).nom, alt:j.alt }))); return out; }
function slotsDone(){ const m={}; store.get("tests", []).forEach(r => { if(r.slot) m[r.slot]=true; }); return m; }
function verdict(f){
  const tot = (f.tete||0)+(f.dig||0)+(f.fat||0)+(f.ver||0);
  if(f.gait===false) return { tot, cls:"bad", s:"r", titre:"URGENCE — démarche instable", txt:"Signe possible d'œdème cérébral. Descendre sans effort, ne pas rester seul : prévenir l'hébergement, appeler le 105 ou iPerú +51 944 492 314, puis VYV." };
  if(!(f.tete>=1) || tot<3) return { tot, cls:"ok", s:"g", titre:"Pas de mal des montagnes", txt:"Programme normal. Refaire le test si un symptôme apparaît." };
  if(tot<=5) return { tot, cls:"warn", s:"y", titre:"MAM léger (3-5) — on ne monte plus", txt:"Journée de repos sur place, paracétamol si besoin, boire normalement. Refaire le test matin et soir. Si le score ne baisse pas en 24-48 h ou monte : redescendre." };
  return { tot, cls:"bad", s:"r", titre:"MAM modéré à sévère (6+) — REDESCENDRE", txt:"Sans délibérer : au moins 500 m plus bas, de jour, en transport organisé. Écrire ou appeler VYV avant la dépense (+33 5 86 85 00 50)." };
}
function nowSlot(){
  const t = todayISO(); const h = new Date().getHours();
  const s = slots().filter(x => x.d===t);
  if(!s.length) return null;
  const pref = h<14 ? "matin" : "soir";
  return s.find(x=>x.mo===pref) || s[0];
}

  h += '<p class="sub" style="font-size:13px;margin-top:8px">L\'appli ne peut pas sonner : mets des réveils Android le 26 oct., les 1er, 2 et 3 nov. à 20h, et les matins du 27 oct., 2, 3 et 4 nov.</p>';

    '</tbody></table></div>';
  h += '<h2>Règles</h2><div class="card"><ul class="notes"><li>Symptômes : ne jamais monter plus haut.</li><li>48 h après chaque palier : pas d\'alcool, pas de sport intense.</li><li>Boire normalement, sans excès.</li><li>Dire à l\'hébergement : « Es mi primera vez en altura. »</li><li>L\'appli ne remarque pas un test oublié : c\'est à toi d\'y penser.</li></ul></div>';

function bindAlt(){
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    const q = b.dataset.q, v = Number(b.dataset.v);
    form[q] = q==="gait" ? v===1 : v; render();
  }));
  const s = $("#saveTest");
  if(s) s.addEventListener("click", () => {
    const ns = nowSlot(); const t = todayISO(); const j = D.jours.find(x=>x.d===t);
    const rec = Object.assign({}, form, { ts: Date.now(), slot: ns ? ns.d+"|"+ns.mo : null, lieu: j && j.ville ? cityById(j.ville).nom+" "+j.alt+" m" : "" });
    const hist = store.get("tests", []); hist.push(rec); store.set("tests", hist);
    form = { tete:null, dig:null, fat:null, ver:null, gait:null }; toast("Test enregistré"); render();
  });
  const r = $("#resetTest"); if(r) r.addEventListener("click", () => { form = { tete:null, dig:null, fat:null, ver:null, gait:null }; render(); });
}

/* ---------- search ---------- */
let INDEX = [];
function buildIndex(){
  INDEX = [];
  const itTxt = it => [it.t, it.tag, ...(it.rows||[]).map(r=>r[0]+" "+r[1]), ...(it.notes||[]), ...(it.es||[]).map(p=>p[0]+" "+p[1])].join(" · ");
  D.villes.forEach(c => c.sections.forEach((s,i) => s.items.forEach((it,j) => {
    INDEX.push({ where: c.nom+" › "+s.t+(it.kind?(it.kind==="voir"?" › à voir":" › à manger"):""), title: it.t, txt: itTxt(it)+(it.kind==="manger"?" restaurant resto manger":""), go: { city:c.id, section:i, kind:it.kind||null, anchor:"c-"+i+"-"+j } });
  })));
  D.infos.forEach(s => s.items.forEach((it,j) => INDEX.push({ where:"Infos › "+s.t, title:it.t, txt:itTxt(it), go:{ info:s.id, anchor:"i-"+s.id+"-"+j } })));

  (D.cash.guide||[]).forEach((g,i) => INDEX.push({ where:"Infos › Argent liquide › Distributeurs", title:g.t, txt:g.rows.map(r=>r.join(" ")).join(" · ")+" distributeur cajero ATM", go:{ info:"cash", anchor:"i-cash-g"+i } }));
  D.cash.banques.forEach(b => INDEX.push({ where:"Infos › Argent liquide › Distributeurs", title:b[0], txt:b.join(" · ")+" frais distributeur", go:{ info:"cash" } }));
  D.papiers.forEach(r => INDEX.push({ where:"Infos › Papiers", title:r[0], txt:r[1], go:{ info:"papiers" } }));
  D.jours.forEach((j,i) => INDEX.push({ where:"Jour › "+fmtDay(j.d), title:j.lieu, txt:[...(j.plan||[]).map(p=>p.join(" ")), ...(j.todo||[])].join(" · "), go:{ day:i } }));
  (D.sac||[]).forEach(g => INDEX.push({ where:"Infos › Mon sac", title:g.t, txt:g.items.join(" · ")+" sac valise bagage", go:{ info:"sac" } }));
  (D.trousse||[]).forEach(r => INDEX.push({ where:"Santé › Ma trousse", title:r[0], txt:r[1]+" · "+r[2]+" médicament", go:{ tab:"sante" } }));
  D.meds.forEach(m => INDEX.push({ where:"Santé", title:m.sympt, txt:m.med+" · "+m.dose+" · "+m.note, go:{ tab:"sante" } }));
  D.sos.forEach(s => INDEX.push({ where:"Infos › Urgences", title:s.t, txt:s.v+" "+(s.note||""), go:{ info:"urgences" } }));
  D.phrases.forEach(p => INDEX.push({ where:"Infos › Phrases", title:p[0], txt:p[1], go:{ info:"phrases" } }));
  D.suivi.forEach(s => INDEX.push({ where:"Jour › En suivi", title:s.t, txt:s.txt+" "+s.rows.map(r=>r.join(" ")).join(" "), go:{ tab:"jour" } }));
}
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function hl(text, q){
  const n = norm(text); const i = n.indexOf(q);
  if(i<0) return esc(text.slice(0,110))+(text.length>110?"…":"");
  const a = Math.max(0, i-40), b = Math.min(text.length, i+q.length+70);
  return (a>0?"…":"")+esc(text.slice(a,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length,b))+(b<text.length?"…":"");
}
function openSearch(){
  const ov = document.createElement("div"); ov.className="ov"; ov.id="ovS";
  ov.innerHTML = '<div class="in"><div class="sbox"><input id="q" type="search" placeholder="hôtel, code, distributeur, Kenti, train…" autocomplete="off" aria-label="Rechercher"><button class="btn" id="qClose">Fermer</button></div><ul class="res" id="qRes"></ul></div>';
  document.body.appendChild(ov);
  const inp = $("#q"); inp.focus();
  const run = () => {
    const q = norm(inp.value.trim()); const out = $("#qRes");
    if(q.length<2){ out.innerHTML = '<li class="sub" style="padding:8px 2px">Exemples : <i>Booking</i>, <i>Orange</i>, <i>cajero</i>, <i>Pedro</i>, <i>siège</i>, <i>diarrhée</i>, <i>faux billets</i>.</li>'; return; }
    const words = q.split(/\s+/);
    const hits = INDEX.filter(e => { const n = norm(e.title+" "+e.txt+" "+e.where); return words.every(w => n.includes(w)); }).slice(0,40);
    out.innerHTML = hits.length ? hits.map((e,k)=>'<li><button data-hit="'+k+'"><div class="w">'+esc(e.where)+'</div><b>'+esc(e.title)+'</b><div class="x">'+hl(e.txt, words[0])+'</div></button></li>').join("") : '<li class="sub" style="padding:8px 2px">Rien trouvé.</li>';
    out.querySelectorAll("[data-hit]").forEach(b => b.addEventListener("click", () => { const g = hits[Number(b.dataset.hit)].go; ov.remove(); follow(g); }));
  };
  inp.addEventListener("input", run); run();
  $("#qClose").addEventListener("click", () => ov.remove());
}
function follow(g){
  if(g.city){ state.tab="villes"; state.agg=null; state.city=g.city; state.section=g.section; if(g.kind) state.recoKind=g.kind; render(); scrollToEl(g.anchor); }
  else if(g.info){ state.tab="infos"; state.info=g.info; render(); if(g.anchor) scrollToEl(g.anchor); else window.scrollTo(0,0); }
  else if(g.day!=null){ state.tab="jour"; state.dayIdx=g.day; render(); window.scrollTo(0,0); }
  else { state.tab=g.tab; render(); window.scrollTo(0,0); }
}
function scrollToEl(id){ const el = document.getElementById(id); if(!el) return; const y = el.getBoundingClientRect().top + window.scrollY - 120; window.scrollTo({ top:y, behavior:"smooth" }); el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),1700); }

function openConv(){
  const ov = document.createElement("div"); ov.className="ov"; ov.id="ovC";
  ov.innerHTML = '<div class="in"><div class="sbox" style="justify-content:space-between"><h1 style="margin:6px 0">Soles ↔ euros</h1><button class="btn" id="cClose">Fermer</button></div>'+convHTML()+'<p class="sub" style="font-size:13px">Repères : menú del día 10-20 S/ · bouteille d\'eau 2-3 S/ · Uber en ville 10-25 S/.</p></div>';
  document.body.appendChild(ov); bindConv(); const s = $("#cvS"); if(s) s.focus();
  $("#cClose").addEventListener("click", () => { ov.remove(); render(); });
}
function openDriver(text){
  const ov = document.createElement("div"); ov.className="driver"; ov.setAttribute("role","dialog");
  ov.innerHTML = '<p>'+esc(text)+'</p><small>Touchez l\'écran pour fermer</small>';
  ov.addEventListener("click", () => ov.remove());
  document.body.appendChild(ov);
  try{ navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}
}

function keep(){ const a=$("#depAmt"), n=$("#depNote"); const av=a?a.value:"", nv=n?n.value:""; const y=window.scrollY; render(); window.scrollTo(0,y); if($("#depAmt")) $("#depAmt").value=av; if($("#depNote")) $("#depNote").value=nv; }
function histText(){ return "Tests d'altitude — Théo\n"+store.get("tests",[]).map(r=>{ const v=verdict(r); const dt=new Date(r.ts); return dt.toLocaleString("fr-FR")+" · "+(r.lieu||"")+" · tête "+r.tete+", digestif "+r.dig+", fatigue "+r.fat+", vertiges "+r.ver+" · démarche "+(r.gait?"OK":"difficile")+" · total "+v.tot+"/12 · "+v.titre; }).join("\n"); }
/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if(!t) return;
  const top = () => window.scrollTo(0,0);
  if(t.dataset.tab){ state.tab=t.dataset.tab; state.city=null; state.section=null; state.agg=null; state.info=null; render(); top(); return; }
  if(t.dataset.city){ state.tab="villes"; state.agg=null; state.city=t.dataset.city; state.section=null; render(); top(); return; }
  if(t.dataset.sec!=null){ state.section=Number(t.dataset.sec); state.recoKind="voir"; render(); top(); return; }
  if(t.dataset.citysec){ const [cid,si]=t.dataset.citysec.split('|'); state.tab='villes'; state.agg=null; state.city=cid; state.section=Number(si); state.recoKind='voir'; render(); top(); return; }
  if(t.dataset.agg){ state.agg=t.dataset.agg; render(); top(); return; }
  if(t.dataset.info){ state.tab="infos"; state.info=t.dataset.info; render(); top(); return; }
  if(t.dataset.goinfo){ state.tab="infos"; state.info=t.dataset.goinfo; render(); top(); return; }
  if(t.dataset.back){ const b=t.dataset.back; if(b==="city") state.section=null; else if(b==="villes"){ state.city=null; state.section=null; state.agg=null; } else if(b==="infos") state.info=null; render(); top(); return; }
  if(t.dataset.go){ state.tab=t.dataset.go; state.city=null; state.section=null; state.agg=null; state.info=null; render(); top(); return; }
  if(t.dataset.day!=null && !t.disabled){ state.dayIdx=Number(t.dataset.day); render(); return; }
  if(t.dataset.jump){ scrollToEl(t.dataset.jump); return; }
  if(t.dataset.reco){ state.recoKind=t.dataset.reco; render(); return; }
  if(t.dataset.dcur){ dep.cur=t.dataset.dcur; keep(); return; }
  if(t.dataset.dmode){ dep.mode=t.dataset.dmode; keep(); return; }
  if(t.dataset.dcat){ dep.cat=t.dataset.dcat; keep(); return; }
  if(t.dataset.ddel!=null){ const L=depList(); L.splice(Number(t.dataset.ddel),1); store.set("dep",L); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.id==="copyHist"){ copy(histText(), null); return; }
  if(t.id==="sacReset"){ store.set("sac", {}); render(); return; }
  if(t.dataset.copy!=null){ copy(t.dataset.copy, t); return; }
  if(t.dataset.copyv!=null){ copy(t.dataset.copyv, null); return; }
  if(t.dataset.driver){ openDriver(t.dataset.driver); return; }
  if(t.dataset.conv){ openConv(); return; }
  if(t.dataset.del!=null){ const h = store.get("tests", []); h.splice(Number(t.dataset.del),1); store.set("tests", h); render(); return; }
});

/* ---------- boot: plain data, or encrypted data unlocked by a code ---------- */
async function decrypt(enc, code){
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const key0 = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b(enc.salt), iterations:enc.iter, hash:"SHA-256" }, key0, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b(enc.iv) }, key, b(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(){
  $("#main").innerHTML = '<div class="lock"><h1>Pérou 2026</h1><p class="sub">Les données sont chiffrées. Entre ton code une fois : il reste ensuite sur ce téléphone.</p><form id="lf"><input id="code" type="password" inputmode="text" autocomplete="current-password" aria-label="Code" placeholder="Code"><button class="btn fill" type="submit" style="width:100%;justify-content:center">Ouvrir</button><p id="lerr" class="sub" style="color:var(--bad);margin-top:8px"></p></form></div>';
  $("#lf").addEventListener("submit", async ev => {
    ev.preventDefault(); const code = $("#code").value.trim();
    if(!code){ $("#lerr").textContent = "Entre le code."; return; }
    try{ const d = await decrypt(window.ENC, code); store.set("code", code); start(d); }
    catch(e){ $("#lerr").textContent = "Code incorrect. Réessaie."; }
  });
}
if(window.DATA) start(window.DATA);
else if(window.ENC){
  const saved = store.get("code", null);
  if(saved) decrypt(window.ENC, saved).then(start, lockScreen); else lockScreen();
}
if("serviceWorker" in navigator && window.ENC){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
