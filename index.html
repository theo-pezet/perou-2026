<script>
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem("pe26:"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("pe26:"+k, JSON.stringify(v)); }catch(e){} }
};
let D = null;
const state = { tab: "jour", city: null, section: null, agg: null, info: null, dayIdx: null, recoKind: "voir" };

/* ---------- dates ---------- */
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function todayISO(){ const n = new Date(); return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function fmtDay(s){ const d = parseISO(s); return JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]; }
function daysBetween(a, b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }

/* ---------- small UI helpers ---------- */
function toast(t){ const el = document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), 1600); }
function copy(text, btn){
  const ok = () => { if(btn){ btn.classList.add("done"); btn.textContent="Copié"; setTimeout(()=>{btn.classList.remove("done"); btn.textContent="Copier";},1400);} else toast("Copié"); };
  try{
    navigator.clipboard.writeText(text).then(ok, () => fallback());
  }catch(e){ fallback(); }
  function fallback(){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); ok();}catch(e){ toast("Sélectionne le texte pour le copier"); } ta.remove(); }
}
const digits = s => String(s).replace(/[^\d+]/g,"");
function geoUrl(m, name){ return m.lat!=null ? "geo:"+m.lat+","+m.lng+"?q="+m.lat+","+m.lng+"("+encodeURIComponent(name||"")+")" : "geo:0,0?q="+encodeURIComponent(m.q); }
function mapUrl(m){ return m.lat!=null ? "https://www.google.com/maps/search/?api=1&query="+m.lat+","+m.lng : "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(m.q); }
const ICON = {
  map:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  car:'<svg viewBox="0 0 24 24"><path d="M5 16V11l2-5h10l2 5v5M5 16h14M7 19v-3M17 19v-3M3 11h18"/></svg>',
  wa:'<svg viewBox="0 0 24 24"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>'
};

/* ---------- card renderer ---------- */
function rowsHTML(rows){
  if(!rows || !rows.length) return "";
  return '<dl class="rows">'+rows.map(r => {
    const [k, v, f] = r;
    let extra = "";
    if(f==="c") extra = '<button class="cp" data-copy="'+esc(v)+'">Copier</button>';
    if(f==="tel"){ const n = digits(v); extra = '<span style="display:flex;gap:6px;flex:none"><button class="cp" data-copy="'+esc(v.replace(/\s*\(.*\)$/,""))+'">Copier</button>'+(n.length>8?'<a class="cp" style="text-decoration:none" href="https://wa.me/'+n.replace("+","")+'" target="_blank" rel="noopener">WhatsApp</a>':'')+'</span>'; }
    const mono = f==="tel" ? ' class="mono tel"' : (f==="c" ? ' class="mono"' : "");
    const shown = f==="tel" ? esc(v).replace(/\+?\d[\d ]+\d/, x=>x.replace(/ /g,'\u00a0')) : esc(v);
    return '<dt>'+esc(k)+'</dt><dd><span'+mono+'>'+shown+'</span>'+extra+'</dd>';
  }).join("")+'</dl>';
}
function cardHTML(it, ctx){
  const id = ctx ? ' id="'+esc(ctx)+'"' : "";
  let h = '<article class="card"'+id+'>';
  h += '<div class="hd"><div>'+(it.kind?'<div class="kind '+it.kind+'">'+(it.kind==="voir"?"À voir":"À manger")+'</div>':'')+'<h3>'+esc(it.t)+'</h3></div>'+(it.tag?'<span class="tag acc">'+esc(it.tag)+'</span>':'')+'</div>';
  h += rowsHTML(it.rows);
  if(it.notes && it.notes.length) h += '<ul class="notes">'+it.notes.map(n=>'<li>'+esc(n)+'</li>').join("")+'</ul>';
  if(it.es && it.es.length) h += '<div class="es">'+it.es.map(p=>'<div><b lang="es">'+esc(p[0])+'</b><span>'+esc(p[1])+'</span></div>').join("")+'</div>';
  const acts = [];
  if(it.map) acts.push('<a class="btn" href="'+mapUrl(it.map)+'" target="_blank" rel="noopener">'+ICON.map+'Carte</a><a class="btn" href="'+geoUrl(it.map, it.t)+'">'+ICON.map+'Hors ligne</a>');
  if(it.driver) acts.push('<button class="btn fill" data-driver="'+esc(it.driver)+'">'+ICON.car+'Montrer au chauffeur</button>');
  if(it.link==="altitude") acts.push('<button class="btn" data-go="altitude">Ouvrir le test</button>');
  else if(it.link==="cash") acts.push('<button class="btn" data-goinfo="cash">Plan d\'argent complet</button>');
  else if(it.link) acts.push('<button class="btn" data-city="'+esc(it.link)+'">Ouvrir '+esc(cityById(it.link).nom)+'</button>');

  return D.jours.length-1;

/* ---------- prochain départ ---------- */
function nextDepart(){
  const now = Date.now();
  const list = (D.departs||[]).map(e => { const [d,hm] = e.dt.split("T"); const [Y,M,Dd] = d.split("-").map(Number); const [hh,mm] = hm.split(":").map(Number); return Object.assign({ ts: new Date(Y,M-1,Dd,hh,mm).getTime(), d, hm }, e); });
  const nx = list.find(e => e.ts > now - 10*60000);
  if(!nx) return null;
  const diff = Math.max(0, nx.ts - now); const mins = Math.round(diff/60000);
  const dd = Math.floor(mins/1440), hh = Math.floor((mins%1440)/60), mi = mins%60;
  const count = diff===0 ? "maintenant" : "dans "+(dd? dd+" j ":"")+(dd||hh? hh+" h ":"")+(dd? "" : mi+" min");
  return { t:nx.t, x:nx.x, when: fmtDay(nx.d)+" à "+nx.hm, count };
}

/* ---------- search ---------- */
let INDEX = [];
function buildIndex(){
  INDEX = [];
  const itTxt = it => [it.t, it.tag, ...(it.rows||[]).map(r=>r[0]+" "+r[1]), ...(it.notes||[]), ...(it.es||[]).map(p=>p[0]+" "+p[1])].join(" · ");
  D.villes.forEach(c => c.sections.forEach((s,i) => s.items.forEach((it,j) => {
    INDEX.push({ where: c.nom+" › "+s.t+(it.kind?(it.kind==="voir"?" › à voir":" › à manger"):""), title: it.t, txt: itTxt(it)+(it.kind==="manger"?" restaurant resto manger":""), go: { city:c.id, section:i, kind:it.kind||null, anchor:"c-"+i+"-"+j } });
  })));
  D.infos.forEach(s => s.items.forEach((it,j) => INDEX.push({ where:"Infos › "+s.t, title:it.t, txt:itTxt(it), go:{ info:s.id, anchor:"i-"+s.id+"-"+j } })));
  D.cash.retraits.forEach((r,i) => INDEX.push({ where:"Infos › Argent liquide", title:"Retrait · "+r.d, txt:[r.lieu,r.carte,r.montant,r.cout,r.pourquoi].join(" · ")+" retrait distributeur cajero espèces cash", go:{ info:"cash", anchor:"i-cash-"+i } }));
  D.cash.cartes.forEach((c,i) => INDEX.push({ where:"Infos › Argent liquide", title:c.t, txt:c.rows.map(r=>r.join(" ")).join(" · ")+" frais plafond", go:{ info:"cash", anchor:"i-cash-c"+i } }));
  D.cash.banques.forEach(b => INDEX.push({ where:"Infos › Argent liquide › Distributeurs", title:b[0], txt:b.join(" · ")+" frais distributeur", go:{ info:"cash" } }));
  D.papiers.forEach(r => INDEX.push({ where:"Infos › Papiers", title:r[0], txt:r[1], go:{ info:"papiers" } }));
  D.jours.forEach((j,i) => INDEX.push({ where:"Jour › "+fmtDay(j.d), title:j.lieu, txt:[...(j.plan||[]).map(p=>p.join(" ")), ...(j.todo||[])].join(" · "), go:{ day:i } }));
  D.meds.forEach(m => INDEX.push({ where:"Santé", title:m.sympt, txt:m.med+" · "+m.dose+" · "+m.note, go:{ tab:"sante" } }));
  D.sos.forEach(s => INDEX.push({ where:"Infos › Urgences", title:s.t, txt:s.v+" "+(s.note||""), go:{ info:"urgences" } }));
  D.phrases.forEach(p => INDEX.push({ where:"Infos › Phrases", title:p[0], txt:p[1], go:{ info:"phrases" } }));
  D.suivi.forEach(s => INDEX.push({ where:"Jour › En suivi", title:s.t, txt:s.txt+" "+s.rows.map(r=>r.join(" ")).join(" "), go:{ tab:"jour" } }));
}
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function hl(text, q){
  const n = norm(text); const i = n.indexOf(q);
  if(i<0) return esc(text.slice(0,110))+(text.length>110?"…":"");
  const a = Math.max(0, i-40), b = Math.min(text.length, i+q.length+70);
  return (a>0?"…":"")+esc(text.slice(a,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length,b))+(b<text.length?"…":"");
}
function openSearch(){
  const ov = document.createElement("div"); ov.className="ov"; ov.id="ovS";
  ov.innerHTML = '<div class="in"><div class="sbox"><input id="q" type="search" placeholder="hôtel, code, distributeur, Kenti, train…" autocomplete="off" aria-label="Rechercher"><button class="btn" id="qClose">Fermer</button></div><ul class="res" id="qRes"></ul></div>';
  document.body.appendChild(ov);
  const inp = $("#q"); inp.focus();
  const run = () => {
    const q = norm(inp.value.trim()); const out = $("#qRes");
    if(q.length<2){ out.innerHTML = '<li class="sub" style="padding:8px 2px">Exemples : <i>Booking</i>, <i>SIM</i>, <i>cajero</i>, <i>Pedro</i>, <i>siège</i>, <i>diarrhée</i>.</li>'; return; }
    const words = q.split(/\s+/);
    const hits = INDEX.filter(e => { const n = norm(e.title+" "+e.txt+" "+e.where); return words.every(w => n.includes(w)); }).slice(0,40);
    out.innerHTML = hits.length ? hits.map((e,k)=>'<li><button data-hit="'+k+'"><div class="w">'+esc(e.where)+'</div><b>'+esc(e.title)+'</b><div class="x">'+hl(e.txt, words[0])+'</div></button></li>').join("") : '<li class="sub" style="padding:8px 2px">Rien trouvé.</li>';
    out.querySelectorAll("[data-hit]").forEach(b => b.addEventListener("click", () => { const g = hits[Number(b.dataset.hit)].go; ov.remove(); follow(g); }));
  };
  inp.addEventListener("input", run); run();
  $("#qClose").addEventListener("click", () => ov.remove());
}
function follow(g){
  if(g.city){ state.tab="villes"; state.agg=null; state.city=g.city; state.section=g.section; if(g.kind) state.recoKind=g.kind; render(); scrollToEl(g.anchor); }
  else if(g.info){ state.tab="infos"; state.info=g.info; render(); if(g.anchor) scrollToEl(g.anchor); else window.scrollTo(0,0); }
  else if(g.day!=null){ state.tab="jour"; state.dayIdx=g.day; render(); window.scrollTo(0,0); }
  else { state.tab=g.tab; render(); window.scrollTo(0,0); }
}
function scrollToEl(id){ const el = document.getElementById(id); if(!el) return; const y = el.getBoundingClientRect().top + window.scrollY - 120; window.scrollTo({ top:y, behavior:"smooth" }); el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),1700); }

  if(t.dataset.go){ state.tab=t.dataset.go; state.city=null; state.section=null; state.agg=null; state.info=null; render(); top(); return; }
  if(t.dataset.day!=null && !t.disabled){ state.dayIdx=Number(t.dataset.day); render(); return; }
  if(t.dataset.jump){ scrollToEl(t.dataset.jump); return; }

/* ---------- boot: plain data, or encrypted data unlocked by a code ---------- */
async function decrypt(enc, code){
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const key0 = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b(enc.salt), iterations:enc.iter, hash:"SHA-256" }, key0, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b(enc.iv) }, key, b(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(){
  $("#main").innerHTML = '<div class="lock"><h1>Pérou 2026</h1><p class="sub">Les données sont chiffrées. Entre ton code une fois : il reste ensuite sur ce téléphone.</p><form id="lf"><input id="code" type="password" inputmode="text" autocomplete="current-password" aria-label="Code" placeholder="Code"><button class="btn fill" type="submit" style="width:100%;justify-content:center">Ouvrir</button><p id="lerr" class="sub" style="color:var(--bad);margin-top:8px"></p></form></div>';
  $("#lf").addEventListener("submit", async ev => {
    ev.preventDefault(); const code = $("#code").value.trim();
    if(!code){ $("#lerr").textContent = "Entre le code."; return; }
    try{ const d = await decrypt(window.ENC, code); store.set("code", code); start(d); }
    catch(e){ $("#lerr").textContent = "Code incorrect. Réessaie."; }
  });
}
if(window.DATA) start(window.DATA);

}
